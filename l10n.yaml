# Звідки Flutter бере переклад.
#
# `lib/l10n/app_*.arb` це **зібрані** файли, їх не правлять руками: їх пише
# `node tools/l10n.mjs` із теки `l10n/`, де кожен екран має власний файл. Один
# arb на весь застосунок виріс би до двох тисяч рядків, у які ніхто не
# заглядатиме.
#
# Шаблон англійський навмисно. Саме він задає перелік ключів, і саме англійська
# лишається запасною мовою для пристроїв, чиєї мови в нас немає.

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L
nullable-getter: false
